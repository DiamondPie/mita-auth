packages:
  - "apps/*"
  - "packages/*"
  # The playground is a folder of sibling demos, not a package itself — it has no
  # package.json, which is what keeps `apps/*` from claiming it.
  - "apps/*/*"
allowBuilds:
  # Its postinstall only copies the browser service worker; tests intercept in Node.
  msw: false
  # Next pulls it in for image optimisation, which neither demo uses.
  sharp: false
minimumReleaseAgeExclude:
  - tsdown@0.22.14
  - '@next/env@16.2.12'
  - '@next/swc-darwin-arm64@16.2.12'
  - '@next/swc-darwin-x64@16.2.12'
  - '@next/swc-linux-arm64-gnu@16.2.12'
  - '@next/swc-linux-arm64-musl@16.2.12'
  - '@next/swc-linux-x64-gnu@16.2.12'
  - '@next/swc-linux-x64-musl@16.2.12'
  - '@next/swc-win32-arm64-msvc@16.2.12'
  - '@next/swc-win32-x64-msvc@16.2.12'
  - next@16.2.12
