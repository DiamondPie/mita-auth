name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

# No `id-token: write`: Trusted Publishing would need the npm CLI, and `changeset publish`
# spawns `pnpm publish` here — pnpm neither exchanges an OIDC token nor generates
# provenance, and it is also the only tool that rewrites this workspace's `workspace:*`
# dependency specifiers into real ranges. See plan.md for the full reasoning.
permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Only the published packages. `pnpm build` would also build the playground demos,
      # which nothing here publishes and whose failure would block a release.
      - run: pnpm turbo run build --filter="./packages/*"

      # CI runs on `push: main` too, but as a separate workflow it cannot block this one:
      # merging the version PR would publish even with CI red. Re-running the package
      # checks here is what actually gates the publish.
      - run: pnpm turbo run typecheck test check:exports --filter="./packages/*"

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Must be an automation token: a publish from CI cannot answer a 2FA prompt.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
