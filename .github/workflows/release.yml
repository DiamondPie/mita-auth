name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # required for npm Trusted Publishing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Only the published packages. `pnpm build` would also build the playground demos,
      # which nothing here publishes and whose failure would block a release.
      - run: pnpm turbo run build --filter="./packages/*"

      # CI runs on `push: main` too, but as a separate workflow it cannot block this one:
      # merging the version PR would publish even with CI red. Re-running the package
      # checks here is what actually gates the publish.
      - run: pnpm turbo run typecheck test check:exports --filter="./packages/*"

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
