name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

# No `id-token: write`: Trusted Publishing would need the npm CLI, and `changeset publish`
# spawns `pnpm publish` here — pnpm neither exchanges an OIDC token nor generates
# provenance, and it is also the only tool that rewrites this workspace's `workspace:*`
# dependency specifiers into real ranges. See plan.md for the full reasoning.
permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Only the published packages. `pnpm build` would also build the playground demos,
      # which nothing here publishes and whose failure would block a release.
      - run: pnpm turbo run build --filter="./packages/*"

      # CI runs on `push: main` too, but as a separate workflow it cannot block this one:
      # merging the version PR would publish even with CI red. Re-running the package
      # checks here is what actually gates the publish.
      #
      # What belongs on that gate is decided by subject, not by cost: these four judge the
      # artefact itself — publint its manifest and what `files` really ships, attw how its
      # types resolve — and publint in particular catches the kind of defect that surfaces
      # nowhere else, because nothing but a publish ever reads those fields. The react-18,
      # vue-3-3, server-edge and playground jobs judge a host environment instead; a red
      # one of those is a compatibility bug, not an unpublishable package, and direct
      # pushes to `main` are what branch protection is for.
      - run: pnpm turbo run typecheck check:exports lint:publish --filter="./packages/*"

      # `test` gets its own step because CI runs it that way and CI is the green one. Folded
      # into the call above, turbo hands two cores to ~19 tasks at once, and tests that take
      # well under a second anywhere else start losing to their wall-clock budgets.
      - run: pnpm turbo run test --filter="./packages/*"

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Must be an automation token: a publish from CI cannot answer a 2FA prompt.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
