name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm build

      - run: pnpm check:exports

      - run: pnpm test

  # The workspace installs React 19, but @mita-auth/react promises ^18 too. Without this
  # the older half of that range would ship untested.
  react-18:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @mita-auth/react add -D react@^18 react-dom@^18 @types/react@^18 @types/react-dom@^18

      - run: pnpm turbo run typecheck --filter @mita-auth/react

      - run: pnpm turbo run test --filter @mita-auth/react

  # Same reasoning for @mita-auth/vue's ^3.3.1: the workspace installs Vue 3.5, and
  # @nanostores/vue's own floor is what puts 3.3 in range.
  vue-3-3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @mita-auth/vue add -D vue@~3.3

      - run: pnpm turbo run typecheck --filter @mita-auth/vue

      - run: pnpm turbo run test --filter @mita-auth/vue
